[workspace]
resolver = "2"
members = [
    "poc1-slint-wgpu-texture",
    "poc2-ime-probe",
    "poc3-cubecl-wgpu-share",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# Slint: winit 백엔드 + wgpu(femtovg-wgpu) 렌더러 + unstable-wgpu-29(외부 텍스처/디바이스 주입 API)
slint = { version = "1.17.1", default-features = false, features = [
    "compat-1-2",
    "std",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "unstable-wgpu-29",
    "accessibility",
] }
slint-build = "1.17.1"
# CubeCL: wgpu 백엔드만. cubecl-wgpu 0.10 은 wgpu 29 를 요구 → Slint(unstable-wgpu-29)와 동일 크레이트/버전
cubecl = { version = "0.10", features = ["wgpu"] }
# PoC1 은 slint::wgpu_29::wgpu 재export 를 쓰므로 wgpu 를 직접 의존하지 않는다(버전 불일치 원천 차단).
# PoC3 은 WgpuSetup 필드에 wgpu 타입이 필요하므로 직접 의존한다(동일 29.x 로 통합됨).
wgpu = "29"
pollster = "0.4"
winit = "0.30"
log = "0.4"
env_logger = "0.11"
